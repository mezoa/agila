[project]
name = "agila"
version = "0.1.0"
description = "A local knowledge assistant: save links, text and PDFs, then ask questions and get short cited answers or a refusal."
readme = "README.md"
authors = [
    { name = "Meo", email = "ameoangelo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py==2.7.1",
    "fastapi==0.133.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf==6.21.2",
    "trafilatura>=2.3.1",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not db and not live'"
markers = [
    "db: needs the Postgres container and a .env (run with -m db)",
    "live: calls the real local Ollama on loopback (run with -m live)",
]
