# One check per push: ruff and the plain tests (no Postgres, no Ollama, no secret; NFR16).
# Actions are pinned to exact commits (research V168, V169); uv matches the Dockerfile.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest  # the laptop's platform (NFR9)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # the job never pushes (input checked in action.yml, U110)
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.17"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest  # the db and live tests are left out by pyproject.toml
